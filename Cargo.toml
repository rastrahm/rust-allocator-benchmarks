[package]
name = "allocator-benchmarks"
version = "0.1.0"
edition = "2021"
description = "High-throughput memory allocator benchmark suite"
license = "MIT"

[features]
default = ["use-system"]
use-system = []
use-jemalloc = ["dep:tikv-jemallocator"]
use-mimalloc = ["dep:mimalloc"]
# Red C — async TCP multi-conexión (Paso 2)
ingress-async = ["dep:tokio"]
# Red D — io_uring production-like (Paso 3)
ingress-io-uring = ["ingress-async", "dep:tokio-uring"]
# GPU C — kernels CUDA + VRAM (Paso 4)
gpu-cuda = ["dep:cudarc"]
# GPU D — benchmark serio GPU (Paso 5)
gpu-serious = ["gpu-cuda"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
hdrhistogram = "7.5"
rayon = "1.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["net", "rt-multi-thread", "sync", "macros", "io-util", "time"], optional = true }
tokio-uring = { version = "0.5", optional = true }

tikv-jemallocator = { version = "0.6", optional = true }
mimalloc = { version = "0.1", optional = true }
cudarc = { version = "0.13", optional = true, features = ["driver", "cuda-12080"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "allocator_latencies"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true

[profile.bench]
inherits = "release"
